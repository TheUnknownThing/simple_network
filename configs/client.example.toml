server = "127.0.0.1:41641"
transport = "udp" # or "tcp"
node_id = "00000000-0000-0000-0000-000000000002"
virtual_ip = "10.0.0.2"
# Linux: set an arbitrary name like "sn0".
# macOS: use "utun", "utunX", or "auto".
tun = "sn0"
# Optional tuning (recommended when using an Internet relay):
netmask = "255.255.255.0"
mtu = 1280

# Relay control-plane secret (32 bytes base64). Must match relay.
relay_psk_base64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Client-only network secret for end-to-end data encryption.
# All clients in the same overlay must share the same value.
# The relay does NOT need this.
network_psk_base64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="


