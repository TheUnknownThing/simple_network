server = "127.0.0.1:41641"
node_id = "00000000-0000-0000-0000-000000000002"
virtual_ip = "10.0.0.2"
# Linux: set an arbitrary name like "sn0".
# macOS: use "utun", "utunX", or "auto".
tun = "sn0"
# Optional tuning (recommended when using an Internet relay):
netmask = "255.255.255.0"
mtu = 1280
# 32 bytes base64. Must match relay.
psk_base64 = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Static routing: virtual IPv4 -> node_id
[peers]
"10.0.0.3" = "00000000-0000-0000-0000-000000000003"
